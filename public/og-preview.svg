<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0c10" />
      <stop offset="50%" stop-color="#12141c" />
      <stop offset="100%" stop-color="#07080b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce99f" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#997b15" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#232634" stroke-width="0.75" opacity="0.6" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Accent glow effects -->
  <circle cx="1050" cy="180" r="280" fill="#d4af37" opacity="0.06" filter="blur(50px)" />
  <circle cx="150" cy="500" r="240" fill="#38bdf8" opacity="0.04" filter="blur(40px)" />

  <!-- Outer Border -->
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#232634" stroke-width="2" />
  <rect x="26" y="26" width="1148" height="578" rx="14" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.25" />

  <!-- Architectural Graphic Right Side -->
  <g transform="translate(740, 120)">
    <!-- Node Box 1: Ingress CDN -->
    <rect x="40" y="20" width="180" height="54" rx="6" fill="#161824" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="130" y="52" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">EDGE CDN / WAF</text>

    <!-- Flow Line -->
    <path d="M 130 74 L 130 110" stroke="#d4af37" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Node Box 2: API Gateway -->
    <rect x="20" y="110" width="220" height="60" rx="6" fill="#141622" stroke="#d4af37" stroke-width="2"/>
    <text x="130" y="145" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">API GATEWAY CLUSTER</text>

    <!-- Flow Lines to Services -->
    <path d="M 60 170 L 60 210" stroke="#22c55e" stroke-width="2"/>
    <path d="M 200 170 L 200 210" stroke="#c084fc" stroke-width="2"/>

    <!-- Microservices -->
    <rect x="0" y="210" width="120" height="54" rx="6" fill="#161824" stroke="#22c55e" stroke-width="1.5"/>
    <text x="60" y="242" fill="#4ade80" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">AUTH / TENANT</text>

    <rect x="140" y="210" width="120" height="54" rx="6" fill="#161824" stroke="#c084fc" stroke-width="1.5"/>
    <text x="200" y="242" fill="#c084fc" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">EVENT BUS</text>

    <!-- Flow to Storage Tier -->
    <path d="M 60 264 L 60 310" stroke="#d4af37" stroke-width="2"/>
    <path d="M 200 264 L 200 310" stroke="#fb923c" stroke-width="2"/>

    <!-- Storage Cluster -->
    <rect x="20" y="310" width="220" height="60" rx="6" fill="#181a26" stroke="#d4af37" stroke-width="1.5"/>
    <text x="130" y="345" fill="#fce99f" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SHARDED STORAGE / WAL</text>
  </g>

  <!-- Left Content Column -->
  <g transform="translate(80, 110)">
    <!-- Eyebrow Badge -->
    <rect x="0" y="0" width="310" height="32" rx="4" fill="#1a1c28" stroke="#d4af37" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#d4af37" />
    <text x="32" y="21" fill="#d4af37" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="2">STAFF &amp; PRINCIPAL BLUEPRINT</text>

    <!-- Title -->
    <text x="0" y="96" fill="#ffffff" font-family="serif" font-size="52" font-weight="bold">System Design</text>
    <text x="0" y="152" fill="url(#goldGrad)" font-family="serif" font-size="44" font-style="italic">for SaaS &amp; IaaS Platforms</text>

    <!-- Subtitle -->
    <text x="0" y="210" fill="#94a3b8" font-family="sans-serif" font-size="20">Production Reference Guide &amp; Interactive Interview Prep</text>
    <text x="0" y="240" fill="#cbd5e1" font-family="sans-serif" font-size="16">Multi-Tenancy • Hyperscale IaaS • CAP &amp; Raft Consensus • Capacity Math</text>

    <!-- Metrics Grid -->
    <g transform="translate(0, 290)">
      <!-- Metric 1 -->
      <rect x="0" y="0" width="130" height="74" rx="6" fill="#141622" stroke="#232634" stroke-width="1"/>
      <text x="65" y="32" fill="#d4af37" font-family="serif" font-size="26" font-weight="bold" text-anchor="middle">20+</text>
      <text x="65" y="55" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">CASE STUDIES</text>

      <!-- Metric 2 -->
      <rect x="146" y="0" width="130" height="74" rx="6" fill="#141622" stroke="#232634" stroke-width="1"/>
      <text x="211" y="32" fill="#38bdf8" font-family="serif" font-size="26" font-weight="bold" text-anchor="middle">250+</text>
      <text x="211" y="55" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">STAFF QUESTIONS</text>

      <!-- Metric 3 -->
      <rect x="292" y="0" width="130" height="74" rx="6" fill="#141622" stroke="#232634" stroke-width="1"/>
      <text x="357" y="32" fill="#22c55e" font-family="serif" font-size="26" font-weight="bold" text-anchor="middle">RFC/SLA</text>
      <text x="357" y="55" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">VERIFIED SPECS</text>

      <!-- Metric 4 -->
      <rect x="438" y="0" width="140" height="74" rx="6" fill="#141622" stroke="#232634" stroke-width="1"/>
      <text x="508" y="32" fill="#c084fc" font-family="serif" font-size="24" font-weight="bold" text-anchor="middle">2x TAP</text>
      <text x="508" y="55" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">AI EXPLAINER</text>
    </g>

    <!-- Footer Bar -->
    <g transform="translate(0, 420)">
      <circle cx="8" cy="8" r="4" fill="#22c55e" />
      <text x="22" y="12" fill="#64748b" font-family="monospace" font-size="13">RFC 9110 • PACELC • Raft Consensus • Write-Ahead Logging • Nitro Architecture</text>
    </g>
  </g>
</svg>
